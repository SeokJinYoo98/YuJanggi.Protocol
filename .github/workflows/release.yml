name: Release Protocol
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: protocol-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Read package version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ([xml](Get-Content src/YuJanggiCommon/YuJanggiCommon.csproj -Raw)).Project.PropertyGroup.Version | Select-Object -First 1
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid version' }
          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          $release = gh release view "v$version" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($release | ConvertFrom-Json).isDraft) {
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $refs = git ls-remote origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read tags' }
          if ($refs) {
            git fetch origin "refs/tags/v$version"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch tag' }
            $commit = git rev-parse 'FETCH_HEAD^{commit}'
            if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) { throw 'Rerun original release or bump version' }
          }
          exit 0
      - name: Test and build packages
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/Build-Packages.ps1 -Version $env:VERSION
      - name: Reserve tag and draft release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git ls-remote origin "refs/tags/$RELEASE_TAG")" ]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
      - name: Publish NuGet
        if: steps.version.outputs.skip != 'true'
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/$VERSION/nuget/*.nupkg" \
            --source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
            --api-key "$PACKAGE_TOKEN" --skip-duplicate
      - name: Publish immutable UPM tag
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          TAG="upm/v$VERSION"
          EXISTING="$(git ls-remote origin "refs/tags/$TAG")"
          if [ -n "$EXISTING" ]; then
            git fetch origin "refs/tags/$TAG"
            git show FETCH_HEAD:protocol-version.json > "$RUNNER_TEMP/protocol-version.json"
            python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/protocol-version.json")); assert p["commit"] == os.environ["GITHUB_SHA"], "UPM tag source mismatch"'
            exit 0
          fi
          # Create a package-only commit using a separate index; preserve the source checkout.
          export GIT_INDEX_FILE="$RUNNER_TEMP/upm-index"
          git read-tree --empty
          git --work-tree="artifacts/$VERSION/upm" add --all
          TREE="$(git write-tree)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COMMIT="$(printf 'Protocol UPM %s\n' "$VERSION" | git commit-tree "$TREE")"
          git tag "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"
      - name: Attach downloadable packages
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Protocol $VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/$VERSION/nuget/*.nupkg artifacts/$VERSION/*.tgz --clobber
          gh release edit "$RELEASE_TAG" --draft=false
