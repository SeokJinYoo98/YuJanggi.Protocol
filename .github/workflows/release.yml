name: Release Protocol
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: protocol-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test and build packages
        shell: pwsh
        run: ./scripts/Build-Packages.ps1 -Version $env:VERSION
      - name: Publish NuGet
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/$VERSION/nuget/*.nupkg" \
            --source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
            --api-key "$PACKAGE_TOKEN" --skip-duplicate
      - name: Publish immutable UPM tag
        shell: bash
        run: |
          TAG="upm/v$VERSION"
          EXISTING="$(git ls-remote origin "refs/tags/$TAG")"
          if [ -n "$EXISTING" ]; then
            git fetch origin "refs/tags/$TAG"
            git show FETCH_HEAD:protocol-version.json > "$RUNNER_TEMP/protocol-version.json"
            python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/protocol-version.json")); assert p["commit"] == os.environ["GITHUB_SHA"], "UPM tag source mismatch"'
            exit 0
          fi
          # Create a package-only commit using a separate index; preserve the source checkout.
          export GIT_INDEX_FILE="$RUNNER_TEMP/upm-index"
          git read-tree --empty
          git --work-tree="artifacts/$VERSION/upm" add --all
          TREE="$(git write-tree)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COMMIT="$(printf 'Protocol UPM %s\n' "$VERSION" | git commit-tree "$TREE")"
          git tag "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"
      - name: Attach downloadable packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Protocol $VERSION" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/$VERSION/nuget/*.nupkg artifacts/$VERSION/*.tgz --clobber
